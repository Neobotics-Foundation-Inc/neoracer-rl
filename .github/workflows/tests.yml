name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # neoracer-mujoco comes from its GitHub Release wheel, which contains the
      # car meshes, so this checkout needs no Git LFS.
      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run the validation suite
        run: python -m pytest -q validation
