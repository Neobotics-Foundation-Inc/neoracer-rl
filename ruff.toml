extend-exclude = ["users"]

# A frozen dataclass with immutable fields is a safe default value
# (AGENTS.md rule 1: `params: Params = Params()`). ruff B008 does not know this
# yet (https://github.com/astral-sh/ruff/issues/29071). RUF009 knows it only
# for a class in the same module. List here each frozen config class that is a
# default in another module, or a function default. When ruff fixes this,
# remove this section.
[lint.flake8-bugbear]
extend-immutable-calls = [
  "neoracer_mujoco.control.track_centering.TrackCenteringConfig",
  "neoracer_mujoco.control.wall_following.WallFollowingConfig",
  "neoracer_mujoco.physics.PhysicsRanges",
  "neoracer_mujoco.physics.Range",
  "neoracer_mujoco.sim.SpawnRange",
  "neoracer_rl.envs.neoracer_env.NeoRacerEnvConfig",
  "neoracer_rl.envs.race.RaceConfig",
  "neoracer_rl.envs.task.CarObservation",
  "neoracer_rl.envs.task.LapEnds",
  "neoracer_rl.envs.task.ProgressReward",
]
